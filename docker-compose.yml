version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: epms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: epms
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/epms
      - JWT_SECRET=epms_super_secure_jwt_secret_key_2026_educational_monitoring
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./epms-frontend
      dockerfile: Dockerfile
    container_name: epms-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
